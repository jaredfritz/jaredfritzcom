<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="referrer" content="no-referrer">

<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/site.webmanifest">

<link rel="canonical" href="https://jaredfritz.com/card/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jared Fritz">
<meta property="og:title" content="Jared Fritz — Card">
<meta property="og:description" content="Connect with Jared Fritz and save his contact details.">
<meta property="og:url" content="https://jaredfritz.com/card/">
<meta property="og:image" content="https://jaredfritz.com/assets/brand/social-preview.png">
<meta property="og:image:type" content="image/png">

<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:image:alt" content="Jared Fritz with the geometric JF monogram on a white background">
</head>
<body>
<main class="contact-card" aria-labelledby="name">
<div class="cover" id="cover"><span class="cover-placeholder">Cover photo to come</span></div>
<div class="card-body">
<div class="identity-top"><div class="portrait" id="portrait" aria-label="Profile photo placeholder">JF</div></div>
<h1 class="sr-only" id="name">Jared Fritz</h1>

<section class="physical-card" aria-label="Physical business card">
<details class="card-flip" id="card-flip">
<summary aria-label="Flip business card">
<span class="card-flip-inner">
<img class="card-face card-front" src="../assets/business-card-front.webp" alt="Jared Fritz, Senior Director, Strategic Partnerships. jared.f@quill.org. www.quill.org. LinkedIn: jaredfritz.">
<img class="card-face card-back" aria-hidden="true" src="../assets/business-card-back.webp" alt="Quill. Learn to write. Write to learn.">
</span>
<span class="flip-hint"><span class="show-back">Show back ↻</span><span class="show-front">Show front ↻</span></span>
</summary>
</details>

</section>
<nav class="contact-links" id="links" aria-label="Contact options"></nav>
<p class="status" id="status" role="status" aria-live="polite"></p>
<div class="actions"><button class="save" id="save" type="button"><span aria-hidden="true">↓</span> Save Contact</button></div>
<div class="share-actions">
<button class="share-card" id="share-card" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m-4 4 4-4 4 4M6 12H4v9h16v-9h-2"/></svg> link share</button>
<span class="share-divider" aria-hidden="true"></span>
<button class="share-card" id="share-qr" type="button" aria-haspopup="dialog" aria-controls="qr-share"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h-3zM18 18h3v3h-3z"/></svg> QR share</button>
<input id="share-url" class="share-url" type="text" readonly hidden aria-label="Card link to copy">
</div>




</div>
</main>
<dialog class="qr-share" id="qr-share" aria-label="QR code to share Jared Fritz’s card">
<button class="qr-close" id="qr-close" type="button" aria-label="Close QR code" autofocus><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<img src="../assets/card-qr.svg" width="264" height="264" alt="QR code for https://jaredfritz.com/card/">
</dialog>
<dialog class="card-welcome" id="card-welcome" tabindex="-1" style="outline:none" aria-label="Welcome — Jared Fritz business card">
<div class="welcome-content">
<div class="welcome-card" id="welcome-card">
<div class="welcome-rotor">
<img class="welcome-face welcome-logo" src="../assets/business-card-back.webp" alt="Quill. Learn to write. Write to learn.">
<img class="welcome-face welcome-contact" src="../assets/business-card-front.webp" alt="Jared Fritz, Senior Director, Strategic Partnerships. jared.f@quill.org. www.quill.org. LinkedIn: jaredfritz." aria-hidden="true">
</div>
</div>


</div>
</dialog>
</body>
</html>
